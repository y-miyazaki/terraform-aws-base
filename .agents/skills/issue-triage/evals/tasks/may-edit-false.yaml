id: issue-triage-may-edit-false-001
name: issue-triage API-only when may_edit is false
description: >-
  Validate may_edit false limits side effects to labels/comments and states no
  repository file edits.
tags:
  - quality
  - constraints
inputs:
  prompt: >-
    Use issue-triage with automation constraints may_edit false. Triage Issue #15 from
    detect JSON. Emit ## Overview stating no repository file edits. List gh label/comment
    actions under ## Changes. Include ## Session Metrics. Do not open PRs or start
    issue-autofix.
  context:
    skip: false
    issue_number: 15
    title: "Docs page missing install section"
    body: "README install steps are outdated."
    labels:
      - needs-triage
    event: opened
expected:
  output_contains:
    - Overview
    - Changes
    - no repository file edits
  outcomes:
    - type: task_completed
