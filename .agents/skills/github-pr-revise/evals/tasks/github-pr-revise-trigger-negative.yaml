id: github-pr-revise-trigger-negative-001
name: github-pr-revise rejects mention-less and bot comments
description: Validate github-pr-revise does not act without mention-gated human feedback.
tags:
  - quality
  - trigger-negative
inputs:
  prompt: >-
    Use github-pr-revise. Detect JSON has a bot comment without the configured mention — that is
    out of scope. Explain the request is out of scope or skipped. Emit ## Overview and ##
    Summary. Do not edit files.
  context:
    skip: true
    pr_number: 55
    mention: "@loop"
    comment_body: "LGTM"
    actor: github-actions[bot]
expected:
  output_contains:
    - Overview
    - skip
  outcomes:
    - type: task_completed
