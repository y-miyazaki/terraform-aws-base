id: refactor-interactive-bare-fix-001
name: refactor bare fix enters apply
description: >-
  Validate that a request asking for changes ("fix") sets agent_edit_allowed true
  and the run emits apply shape, not survey.
tags:
  - quality
  - interactive
  - agent-edit-allowed
inputs:
  prompt: >-
    Use refactor. The user says only "fix". That asks for changes to be made, so
    agent_edit_allowed is true and agent_edit_target is fix.
    Emit apply shape with ## Overview, ## Summary, ### Changes, and ## Verification per
    common-output-format.md. Do not emit ### Candidates. Describe the edit; do not modify
    files in this mock eval.
  context:
    commit_range: eval0001..eval0002
    skip: false
    hints:
      - kind: duplication_block
        path: scripts/example.sh
        detail: lines 10-17 duplicate scripts/other.sh:40-47
        lines: 8
expected:
  output_contains:
    - Overview
    - Summary
    - Changes
    - Verification
  outcomes:
    - type: task_completed
