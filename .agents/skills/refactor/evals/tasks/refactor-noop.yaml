id: refactor-noop-001
name: refactor emits no-op when input empty
description: Verify refactor stops with survey no-op when nothing actionable.
tags:
  - quality
  - no-op
inputs:
  prompt: >-
    Use refactor. No paths or symbols. Emit survey no-op per common-output-format.md:
    ## Overview (why nothing actionable; no edits applied), ## Summary (no-op).
    Do not emit Session Metrics or internal tier labels. Do not edit files in this
    mock eval.
expected:
  output_contains:
    - "## Overview"
    - "## Summary"
    - no-op
    - no edits applied
  outcomes:
    - type: task_completed
