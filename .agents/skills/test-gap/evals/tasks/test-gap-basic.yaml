id: test-gap-contract-001
name: test-gap emits apply shape without claiming execution
description: >-
  Validate test-gap emits ## Verification that states the command CI runs and does not claim the tests passed.
tags:
  - quality
  - output-contract
inputs:
  prompt: >-
    Use test-gap with agent_edit_allowed true and agent_edit_target fix. The target scripts/foo.sh has no paired test.
    Emit the apply PR shape with ### Changes, ### Deferred when applicable, and ## Verification.
    Tests are not run in this environment; state the command and expected result and do not claim they passed.
    Emit ## Overview and ## Summary per common-output-format.md.
  context:
    skip: false
    hotspots:
      - path: scripts/foo.sh
        kind: churn
        count: 7
        window: 90.days
    ledger:
      file: state-test-gap-ledger.json
      processed: []
expected:
  output_contains:
    - Overview
    - Summary
    - Changes
    - Verification
  outcomes:
    - type: task_completed
