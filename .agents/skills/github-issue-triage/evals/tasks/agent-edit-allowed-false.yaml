id: github-issue-triage-agent-edit-allowed-false-001
name: github-issue-triage API-only when agent_edit_allowed is false
description: >-
  Validate agent_edit_allowed false limits side effects to labels/comments and states no
  repository file edits.
tags:
  - quality
  - constraints
inputs:
  prompt: >-
    Use github-issue-triage with automation constraints agent_edit_allowed false. Triage Issue #15 from
    detect JSON. Emit ## Overview stating no repository file edits. List gh label/comment
    actions under ## Changes. Include ## Session Metrics. Do not open PRs or start
    github-issue-autofix.
  context:
    skip: false
    issue_number: 15
    title: "Docs page missing install section"
    body: "README install steps are outdated."
    labels:
      - needs-triage
    event: opened
expected:
  output_contains:
    - Overview
    - Changes
    - no repository file edits
  outcomes:
    - type: task_completed
