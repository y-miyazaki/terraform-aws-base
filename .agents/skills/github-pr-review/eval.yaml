name: github-pr-review-eval
description: >-
  Evaluation suite for github-pr-review.
  Verifies report JSON shape, skip exits, rule quote citation, suppression of
  preference-only and pre-existing findings, and trigger-negative guardrails
  (no posting, no source edits).
skill: github-pr-review
version: "1.0"
config:
  trials_per_task: 5
  timeout_seconds: 180
  parallel: false
  executor: mock
  model: claude-sonnet-4-20250514
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Verify evaluation task completes successfully.
graders:
  - type: code
    name: has_structured_output
    weight: 1.0
    config:
      assertions:
        - "'## Overview' in output or 'Overview' in output or 'findings' in output"
        - "'findings' in output or 'skip' in output.lower() or 'github-pr-revise' in output"
  - type: text
    name: report_sections
    weight: 0.5
    config:
      regex_match:
        - (## Overview|## Summary|findings|skip|github-pr-revise)
  - type: behavior
    name: bounded_runtime
    weight: 0.5
    config:
      max_tool_calls: 30
      max_tokens: 120000
      max_duration_ms: 180000
tasks:
  - evals/tasks/*.yaml
