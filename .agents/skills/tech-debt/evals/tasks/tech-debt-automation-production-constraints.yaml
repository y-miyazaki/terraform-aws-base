id: tech-debt-automation-constraints-001
name: tech-debt automation production constraints
description: Validate automation Constraints with agent_edit_allowed from assembled prompt shape.
tags:
  - quality
  - automation
inputs:
  prompt: >-
    Use tech-debt. ## Constraints agent_edit_allowed: true agent_edit_target: report agent_report_file:
    docs/report/tech-debt/2026-07-19.md You MUST persist agent_report_file within allowlist. Allowed paths:
    docs/report/tech-debt/**/*.md. Classify injected eol_hint as dependency_version; emit
    apply shape with ### Changes and ## Verification plus ## Session Metrics. Emit ##
    Overview and ## Summary per common-output-format.md. Include Category labels on rows.
  context:
    commit_range: eval0001..eval0002
    agent_report_file: docs/report/tech-debt/2026-07-19.md
    skip: false
    signals:
      - kind: eol_hint
        path: evals/files/go.mod.txt
        line: 5
        snippet: "require github.com/old/lib v1.2.3"
        source: go_mod
        hint: dependency_version
    hotspots: []
expected:
  output_contains:
    - Changes
    - Overview
    - Verification
    - Session Metrics
  outcomes:
    - type: task_completed
