id: github-issue-autofix-automation-constraints-001
name: github-issue-autofix automation production constraints
description: Validate automation Constraints with may_edit from assembled prompt shape.
tags:
  - quality
  - automation
inputs:
  prompt: >-
    Use github-issue-autofix. ## Constraints may_edit: true write_target: fix You MUST persist
    edits to disk in the worktree when may_edit is true; a report alone is not sufficient.
    Allowed paths: src/**. Fix Issue #42 from detect JSON in this mock eval (describe the
    fix only). Emit apply shape with ### Changes and ## Verification plus ## Overview and
    ## Summary. Include Fixes #42. Do not emit ### Candidates.
  context:
    skip: false
    issue_number: 42
    title: "Null pointer when user profile missing"
    body: "HandleCreate panics when profile is nil."
    labels:
      - triage:ready
      - autofix
expected:
  output_contains:
    - Changes
    - Overview
    - Verification
    - "Fixes #42"
  outcomes:
    - type: task_completed
