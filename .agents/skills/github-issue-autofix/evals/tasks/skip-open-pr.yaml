id: github-issue-autofix-skip-open-pr-001
name: github-issue-autofix skips when open PR already fixes issue
description: Validate detect skip prevents duplicate PR work.
tags:
  - trigger
  - negative
inputs:
  prompt: >-
    Use github-issue-autofix. Detect JSON has skip=true because an open PR already closes Issue
    #42. Report the skip reason in ## Overview. Do not edit files or open another PR.
    Emit ## Summary noting skip.
  context:
    skip: true
    issue_number: 42
    title: "Null pointer when user profile missing"
    body: "HandleCreate panics when profile is nil."
    labels:
      - triage:ready
      - autofix
    open_pr_number: 101
expected:
  output_contains:
    - Overview
    - skip
  outcomes:
    - type: task_completed
