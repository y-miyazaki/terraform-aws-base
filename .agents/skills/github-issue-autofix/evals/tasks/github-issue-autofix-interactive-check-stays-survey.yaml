id: github-issue-autofix-interactive-check-stays-survey-001
name: github-issue-autofix interactive check request stays survey
description: >-
  Validate that an interactive request to check an Issue, with no request to change files,
  stays survey: Refs the Issue, lists candidates, and edits nothing.
tags:
  - quality
  - interactive
inputs:
  prompt: >-
    Use github-issue-autofix. The user says "check this issue #42". Checking asks to look,
    not to change files, so agent_edit_allowed is false. Do not edit files, commit, push, or
    open a PR. Emit survey shape with ## Overview, ## Summary, and ### Candidates; reference
    the Issue as Refs #42 with no closing keyword, and state no edits applied in Overview. Do
    not emit ### Changes or ## Verification.
  context:
    issue_number: 42
    title: "Null pointer when user profile missing"
    body: "HandleCreate panics when profile is nil."
    labels:
      - triage:ready
expected:
  output_contains:
    - Overview
    - Candidates
    - "Refs #42"
    - no edits applied
  outcomes:
    - type: task_completed
