id: tech-debt-automation-dist01-negative-001
name: tech-debt automation path accepts overridden agent_report_file
description: >-
  Validate agent_report_file is caller-supplied and not hard-locked to
  docs/report/tech-debt/ (DIST-01 path portability).
tags:
  - quality
  - automation-path
  - dist-01
  - portability
inputs:
  prompt: >-
    Use tech-debt (automation path). ## Constraints agent_edit_allowed: true
    agent_edit_target: report agent_report_file: reports/custom-debt/2026-07-25.md
    Allowed paths: reports/custom-debt/**/*.md, docs/**/*.md. Write the report
    only to the Constraints agent_report_file path — do not invent
    docs/report/tech-debt/. Classify injected stale_doc under documentation.
    Emit apply shape with ### Changes naming that agent_report_file, ## Verification,
    and Session Metrics. Emit ## Overview and ## Summary per
    common-output-format.md. Include Category labels on rows.
  context:
    skip: false
    agent_report_file: reports/custom-debt/2026-07-25.md
    previous_report: ""
    signals:
      - kind: stale_doc
        path: docs/guide.md
        line: 1
        snippet: "old path"
        source: mtime
        hint: documentation
    hotspots: []
expected:
  output_contains:
    - Changes
    - reports/custom-debt/2026-07-25.md
    - Overview
    - Session Metrics
  outcomes:
    - type: task_completed
