id: refactor-interactive-bare-refactor-001
name: refactor bare skill name stays survey
description: >-
  Validate that invoking the skill by name alone (bare "refactor" / bare "fix")
  does not set agent_edit_allowed true — survey shape only.
tags:
  - quality
  - interactive
  - agent-edit-allowed
inputs:
  prompt: >-
    Use refactor on scripts/example.sh. The user did not request apply. agent_edit_allowed is
    false. Emit survey shape with ## Overview, ## Summary, and ### Candidates. State
    no edits applied in Overview. Do not edit files in this mock eval.
  context:
    target: scripts/example.sh
expected:
  output_contains:
    - Candidates
    - Overview
    - no edits applied
  outcomes:
    - type: task_completed
