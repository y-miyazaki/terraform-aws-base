id: docs-updater-automation-constraints-001
name: docs-updater automation production constraints
description: Validate automation Constraints with agent_edit_allowed from assembled prompt shape.
tags:
  - quality
  - automation
inputs:
  prompt: >-
    Use docs-updater (automation path). ## Constraints agent_edit_allowed: true agent_edit_target: fix You MUST persist edits
    to disk in the worktree; a report alone is not sufficient when agent_edit_allowed is true. Allowed
    paths: docs/**/*.md. Fix the injected finding (stale workflow reference); emit apply shape
    with ### Changes and ## Verification plus ## Session Metrics. Emit ## Overview and ##
    Summary per common-output-format.md.
  context:
    commit_range: eval0001..eval0002
    skip: false
    findings:
      - file: docs/guide/overview.md
        reason: references deleted workflow ci-build.yaml
        source_commit: eval0002
expected:
  output_contains:
    - Changes
    - Overview
    - Verification
    - Session Metrics
  outcomes:
    - type: task_completed
