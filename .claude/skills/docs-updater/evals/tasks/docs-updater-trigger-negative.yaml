id: docs-updater-trigger-negative-001
name: docs-updater ignores test-only changes
description:
  "Validate that changes limited to test files do not trigger documentation
  updates.

  "
tags:
  - quality
  - trigger-negative
  - boundary-guardrail
inputs:
  prompt: "Use docs-updater. Assume the only changed files are internal test files (e.g., pkg/handler/handler_test.go, pkg/service/service_test.go). Emit survey no-op per common-output-format.md: ## Overview explains no documentation impact and states no edits applied; include ## Summary. Do not emit ### Changes or ## Verification."
  context:
    scope: staged
expected:
  output_contains:
    - "## Overview"
    - "no documentation impact"
    - "no edits applied"
  outcomes:
    - type: task_completed
