    Use issue-autofix with automation constraints may_edit false. Survey Issue #42 from
    detect JSON. Emit survey shape with ## Overview, ## Summary ### Candidates, and note
    no edits applied. Do not emit ## Verification or ### Changes. Do not edit files.
  context:
    skip: false
    issue_number: 42
    title: "Null pointer when user profile missing"
    body: "HandleCreate panics when profile is nil."
