id: issue-autofix-contract-001
name: issue-autofix apply shape with Fixes keyword
description: >-
  Validate issue-autofix emits apply shape with Fixes #N when may_edit is true.
tags:
  - quality
  - output-contract
inputs:
  prompt: >-
    Use issue-autofix with may_edit true and write_target fix. Implement a minimal fix for
    Issue #42 from detect JSON in this mock eval (describe the fix only; do not edit files
    on disk). Emit apply shape with ## Overview, ## Summary ### Changes, ## Verification,
    and Fixes #42 in Overview or Summary per common-output-format.md.
  context:
    skip: false
    issue_number: 42
    title: "Null pointer when user profile missing"
    body: "HandleCreate panics when profile is nil."
    labels:
      - triage:ready
      - autofix
expected:
  output_contains:
    - Overview
    - Changes
    - "Fixes #42"
  outcomes:
    - type: task_completed
