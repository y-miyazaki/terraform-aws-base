id: agent-skills-review-dist01-negative-001
name: agent-skills-review flags non-portable product paths
description: >-
  Validate DIST-01 / S-07 failure when a SKILL embeds consumer product paths
  (.loop/, on-loop-*, autonomy planes) that break APM portability.
tags:
  - quality
  - dist-01
  - portability
  - trigger-negative
inputs:
  prompt: >-
    Use agent-skills-review. Review the injected SKILL.md excerpt in context.
    It hard-requires `.loop/state.json`, references `on-loop-ci-sweeper.yaml`,
    and branches on `level: L2`. Report structural/portability failures with
    ItemIDs (S-07 and/or DIST). Return ## Checks Summary, ## Checks
    (Failed/Deferred Only), and ## Issues. Do not approve the skill as portable.
  context:
    target: SKILL.md
    skill_excerpt: |
      ## Workflow
      1. Read `.loop/state.json` (required).
      2. Follow `on-loop-ci-sweeper.yaml` dogfood allowlist.
      3. When `level` is `L2`, open a PR; when `L1`, survey only.
expected:
  output_contains:
    - "## Checks Summary"
    - "## Issues"
    - S-07
  outcomes:
    - type: task_completed
