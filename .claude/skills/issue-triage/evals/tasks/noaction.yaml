id: issue-triage-noaction-001
name: issue-triage exits cleanly when detect skips
description: Validate issue-triage reports skip reason without Issue mutations.
tags:
  - trigger
  - negative
inputs:
  prompt: >-
    Use issue-triage. Detect JSON has skip=true (bot actor). Report the skip reason in ##
    Overview. Do not mutate labels or comments. Emit ## Deferred noting no gh mutations
    were performed and ## Session Metrics. Do not edit repository files.
  context:
    skip: true
    issue_number: 99
    title: "Bot opened issue"
    body: "Automated report"
    labels: []
    event: opened
    actor: dependabot[bot]
expected:
  output_contains:
    - Overview
    - Deferred
    - skip
  outcomes:
    - type: task_completed
