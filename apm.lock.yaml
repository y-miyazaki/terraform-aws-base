    transport: stdio
    env:
      FASTMCP_LOG_LEVEL: ERROR
    args:
    - awslabs.terraform-mcp-server==1.0.18
    registry: false
    command: uvx
  codebase-memory-mcp:
    name: codebase-memory-mcp
    transport: stdio
    args: []
    registry: false
    command: codebase-memory-mcp
  context7:
    name: context7
    transport: stdio
    args:
    - -y
    - '@upstash/context7-mcp@4.5.0'
    registry: false
    command: npx
  fetch:
    name: fetch
    transport: stdio
    args:
    - --with
    - mcp>=1.28,<2
    - mcp-server-fetch==2026.11.4
    registry: false
    command: uvx
  github:
    name: github
    transport: stdio
    args:
    - -lc
    - TOKEN="${GH_TOKEN:-$GITHUB_TOKEN}"; exec uvx mcp-compressor==0.40.0 -- https://api.githubcopilot.com/mcp/
      -H "Authorization=Bearer ${TOKEN}" --auth explicit-headers
    registry: false
    command: bash
  hashicorp-terraform-mcp-server:
    name: hashicorp-terraform-mcp-server
    transport: stdio
    args:
    - -y
    - terraform-mcp-server@0.13.0
    registry: false
    command: npx
mcp_target_servers:
  claude:
  - aws-documentation-mcp-server
  - aws-knowledge-mcp-server
  - aws-mcp
  - aws-pricing-mcp-server
  - awslabs-terraform-mcp-server
  - codebase-memory-mcp
  - context7
  - fetch
  - github
  - hashicorp-terraform-mcp-server
  cursor:
  - aws-documentation-mcp-server
  - aws-knowledge-mcp-server
  - aws-mcp
  - aws-pricing-mcp-server
  - awslabs-terraform-mcp-server
  - codebase-memory-mcp
  - context7
  - fetch
  - hashicorp-terraform-mcp-server
mcp_config_provenance:
  aws-documentation-mcp-server: config-aws
  aws-knowledge-mcp-server: config-aws
  aws-mcp: config-aws
  aws-pricing-mcp-server: config-aws
  awslabs-terraform-mcp-server: config-terraform-aws
