# mise - Dev Tools, Env Vars, Task Runner
# https://mise.jdx.dev/

[settings]
activate_aggressive = true # Aggressively activate tools in the current config for all shells and commands; may cause unexpected tool activations but closest to former auto_activate.
auto_install = true # Auto-install tools when a mise-managed config is entered or evaluated; closest behavior to former lazy_install.
exec_auto_install = true # Auto-install tools when commands are run via `mise x` / `mise exec`.
github_attestations = true # Verify GitHub release attestations when a backend supports them.
lockfile = true # Generate and maintain mise.lock with resolved URLs and checksums.
locked = true # Require lockfile entries during installs to reduce unexpected upstream changes.
minimum_release_age = "7d" # Avoid very recent releases to reduce supply-chain risk from rushed or bad publishes.
not_found_auto_install = true # Try installing missing tools when a command is looked up from the current config.
provenance_api_failures_fatal = true # Fail installs if provenance verification APIs are unavailable or verification fails.
slsa = true # Require SLSA provenance checks when a backend supports them.

[settings.aqua]
cosign = true   # Verify cosign signatures for aqua-backed packages when available.
minisign = true # Verify minisign signatures for aqua-backed packages when available.
slsa = true     # Require SLSA provenance for aqua-backed packages when available.

[settings.github]
slsa = true # Require SLSA provenance for GitHub-hosted packages when available.

[settings.npm]
package_manager = "pnpm" # Package manager to use for npm-based tools; set to null to disable npm tool support.

[settings.pipx]
uvx = true # Install uv/uvx via pipx for better isolation and performance.

[tools]
# Tools below are `lazy = true`: a bare `mise install` skips them and the shim (created by `mise reshim`)
# downloads the tool on its first command run.
# `lazy_bins` is required for every lazy tool (mise can only derive bins for registry short names).
# Requires mise >= 2026.9.0.
#
# Not lazy (needed before other tools can be installed, or not a command):
#   - runtimes: aqua, node, pnpm, python
#   - uv: used by pipx-backed tools and the mkdocs postinstall
#   - npm:awsp: shell functions (_awsp), no executable to shim

# A Runtime tools
aqua = "v2.65.2"
node = "24.22.1"
pnpm = { version = "11.28.8", depends = ["node"] }
python = "3.14.6"

# AI agent tools
"github:microsoft/apm" = { version = "v0.35.0", lazy = true, lazy_bins = ["apm"] }                                 # agent package manager
claude = { version = "2.1.309", lazy = true, lazy_bins = ["claude"] }                                              # Claude Code CLI
"github:DeusData/codebase-memory-mcp" = { version = "v0.12.1", lazy = true, lazy_bins = ["codebase-memory-mcp"] } # codebase memory MCP server
"aqua:github/copilot-cli" = { version = "1.0.103", lazy = true, lazy_bins = ["copilot"] }                           # GitHub Copilot CLI
"pipx:headroom-ai" = { version = "0.41.0", extras = "proxy,mcp,bedrock", depends = ["python"], lazy = true, lazy_bins = ["headroom", "headroom-cache-ttl"] }
"npm:lean-ctx-bin" = { version = "3.11.4", depends = [
  "node",
], allow_builds = [
  "lean-ctx-bin",
], install_env = { PNPM_CONFIG_IGNORE_SCRIPTS = "true" }, lazy = true, lazy_bins = ["lean-ctx"] } # context optimizer (hooks CLI + MCP npm)
"github:microsoft/waza" = { version = "v0.39.0", lazy = true, lazy_bins = ["waza"] }                              # agent skill evaluator

# AWS related tools
"aqua:aws/aws-cli" = { version = "2.38.5", lazy = true, lazy_bins = ["aws", "aws_completer"] }                     # AWS CLI
"aqua:aws/aws-sam-cli" = { version = "1.170.0", lazy = true, lazy_bins = ["sam"] }                                 # SAM CLI tool
"npm:awsp" = { version = "0.2.0", depends = [
  "node",
], install_env = { NPM_CONFIG_IGNORE_SCRIPTS = "true" } } # AWS profile switcher
"aqua:kayac/ecspresso" = { version = "2.8.7", lazy = true, lazy_bins = ["ecspresso"] }                             # ECS deployment tool
"aqua:Songmu/ecschedule" = { version = "0.21.1", lazy = true, lazy_bins = ["ecschedule"] }                        # ECS scheduled tasks deployment tool
"pipx:aws-mfa" = { version = "0.0.12", depends = ["python"], lazy = true, lazy_bins = ["aws-mfa"] }               # AWS MFA helper

# GitHub related tools
"aqua:rhysd/actionlint" = { version = "1.7.12", lazy = true, lazy_bins = ["actionlint"] }                          # GitHub Actions linter
"aqua:suzuki-shunsuke/disable-checkout-persist-credentials" = { version = "1.0.0", lazy = true, lazy_bins = ["disable-checkout-persist-credentials"] } # disable persist-credentials in checkout action
"aqua:cli/cli" = { version = "2.103.0", lazy = true, lazy_bins = ["gh"] }                                          # GitHub CLI (gh)
"aqua:suzuki-shunsuke/ghalint" = { version = "1.5.6", lazy = true, lazy_bins = ["ghalint"] }                       # GitHub Actions linter
"aqua:suzuki-shunsuke/ghatm" = { version = "1.0.0", lazy = true, lazy_bins = ["ghatm"] }                           # auto-set timeout-minutes for GitHub Actions jobs
"aqua:suzuki-shunsuke/pinact" = { version = "5.0.1", lazy = true, lazy_bins = ["pinact"] }                         # GitHub Actions pinning tool
"aqua:zizmorcore/zizmor" = { version = "1.31.1", lazy = true, lazy_bins = ["zizmor"] }                             # GitHub Actions security auditor

# Go related tools
"aqua:air-verse/air" = { version = "1.67.4", lazy = true, lazy_bins = ["air"] }                                    # live reload
"aqua:bufbuild/buf" = { version = "1.75.0", lazy = true, lazy_bins = ["buf", "protoc-gen-buf-breaking", "protoc-gen-buf-lint"] } # protobuf linter and formatter
"go:github.com/go-delve/delve/cmd/dlv" = { version = "v1.27.2", lazy = true, lazy_bins = ["dlv"] }                 # debugger
"aqua:mvdan/gofumpt" = { version = "0.12.0", lazy = true, lazy_bins = ["gofumpt"] }                                # code formatter
"aqua:golangci/golangci-lint" = { version = "2.15.0", lazy = true, lazy_bins = ["golangci-lint"] }                 # linter
"aqua:goreleaser/goreleaser" = { version = "2.19.0", lazy = true, lazy_bins = ["goreleaser"] }                     # release automation
"go:golang.org/x/tools/gopls" = { version = "v0.24.0", lazy = true, lazy_bins = ["gopls"] }                        # Go language server
"go:golang.org/x/vuln/cmd/govulncheck" = { version = "1.3.0", lazy = true, lazy_bins = ["govulncheck"] }           # vulnerability scanner
"aqua:ko-build/ko" = { version = "0.19.1", lazy = true, lazy_bins = ["ko"] }                                       # container builder
"aqua:vektra/mockery" = { version = "3.8.1", lazy = true, lazy_bins = ["mockery"] }                                # mock code generator for interfaces
"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = { version = "v2.8.0", lazy = true, lazy_bins = ["oapi-codegen"] } # OpenAPI code generator
"aqua:protocolbuffers/protobuf/protoc" = { version = "36.2", lazy = true, lazy_bins = ["protoc"] }                 # protobuf compiler
"aqua:protocolbuffers/protobuf-go/protoc-gen-go" = { version = "1.36.12", lazy = true, lazy_bins = ["protoc-gen-go"] } # protobuf code generator
"aqua:grpc/grpc-go/protoc-gen-go-grpc" = { version = "1.6.1", lazy = true, lazy_bins = ["protoc-gen-go-grpc"] }    # gRPC code generator
"aqua:swaggo/swag" = { version = "1.16.6", lazy = true, lazy_bins = ["swag"] }                                     # API documentation generator
"aqua:go-swagger/go-swagger" = { version = "0.36.6", lazy = true, lazy_bins = ["swagger"] }                        # API documentation generator (swagger)

# Lint / Formatter tools
"npm:cspell" = { version = "10.2.2", depends = [
  "node",
], install_env = { PNPM_CONFIG_IGNORE_SCRIPTS = "true" }, lazy = true, lazy_bins = ["cspell", "cspell-esm"] } # spell checker
"npm:markdown-link-check" = { version = "3.15.0", depends = [
  "node",
], install_env = { PNPM_CONFIG_IGNORE_SCRIPTS = "true" }, lazy = true, lazy_bins = ["markdown-link-check"] } # Markdown link checker
"npm:markdownlint-cli2" = { version = "0.24.0", depends = [
  "node",
], install_env = { PNPM_CONFIG_IGNORE_SCRIPTS = "true" }, lazy = true, lazy_bins = ["markdownlint-cli2"] } # Markdown linter
"npm:prettier" = { version = "3.9.10", depends = [
  "node",
], install_env = { PNPM_CONFIG_IGNORE_SCRIPTS = "true" }, lazy = true, lazy_bins = ["prettier"] } # Code formatter

# Shell / test tools (moved from env/common/Dockerfile apt packages)
"aqua:bats-core/bats-core" = { version = "1.14.0", lazy = true, lazy_bins = ["bats"] }                             # Bats shell test runner
"aqua:koalaman/shellcheck" = { version = "0.11.0", lazy = true, lazy_bins = ["shellcheck"] }                       # shell script linter
"aqua:mvdan/sh" = { version = "3.14.1", lazy = true, lazy_bins = ["shfmt"] }                                       # shell script formatter (shfmt)
"pipx:yamllint" = { version = "1.38.0", depends = ["python"], lazy = true, lazy_bins = ["yamllint"] }              # YAML linter

# Security related tools
"aqua:gitleaks/gitleaks" = { version = "8.30.1", lazy = true, lazy_bins = ["gitleaks"] }                           # secret scanner
"pipx:pre-commit" = { version = "4.7.0", depends = [
  "python",
], lazy = true, lazy_bins = ["pre-commit"] } # pre-commit framework
"pipx:semgrep" = { version = "1.182.1", depends = ["python"], lazy = true, lazy_bins = ["semgrep", "pysemgrep"] } # SAST scanner (uvx-backed pipx)
"aqua:aquasecurity/trivy" = { version = "0.76.1", lazy = true, lazy_bins = ["trivy"] }                             # vulnerability scanner

# Terraform related tools
"aqua:getsops/sops" = { version = "3.13.3", lazy = true, lazy_bins = ["sops"] }                                    # encryption tool
"aqua:hashicorp/terraform" = { version = "1.17.0", lazy = true, lazy_bins = ["terraform"] }                        # infrastructure as code
"aqua:terraform-docs/terraform-docs" = { version = "0.24.0", lazy = true, lazy_bins = ["terraform-docs"] }         # documentation generator
"aqua:terraform-linters/tflint" = { version = "0.65.0", lazy = true, lazy_bins = ["tflint"] }                      # linter

# Utility tools
"aqua:google/go-jsonnet" = { version = "0.22.0", lazy = true, lazy_bins = ["jsonnet", "jsonnet-deps", "jsonnetfmt", "jsonnet-lint"] } # Jsonnet command-line tool
"pipx:mkdocs" = { version = "1.6.1", depends = ["python"], postinstall = "uv pip install --python $MISE_TOOL_INSTALL_PATH/mkdocs/bin/python mkdocs-material mdx-truly-sane-lists", lazy = true, lazy_bins = ["mkdocs"] } # MkDocs with Material theme
"aqua:BurntSushi/ripgrep" = { version = "15.2.0", lazy = true, lazy_bins = ["rg"] }                                # grep alternative (rg)
"aqua:tamasfe/taplo" = { version = "0.10.0", lazy = true, lazy_bins = ["taplo"] }                                  # TOML formatter / LSP
"aqua:jdx/usage" = { version = "7.1.1", lazy = true, lazy_bins = ["usage"] }                                      # usage CLI tool for command help and completions
"aqua:astral-sh/uv" = "0.13.5"                                                                                    # uv/uvx

[tasks.mise-install]
description = "Install tools defined in mise.toml"
alias = ["mi"]
depends = ["mise-install-core"]
run = "NPM_CONFIG_IGNORE_SCRIPTS=true mise install --yes"

[tasks.mise-install-core]
description = "Install core runtimes first"
alias = ["mic"]
run = "NPM_CONFIG_IGNORE_SCRIPTS=true mise install --yes python node pnpm aqua"

[tasks.mise-lock]
description = "Regenerate mise.lock (required after changing tools/settings)"
alias = ["ml"]
run = "sh -c 'MISE_LOCKED=0 mise lock'"

[tasks.mise-trust]
description = "Trust project mise.toml non-interactively"
alias = ["mt"]
run = "mise trust --yes /workspace/mise.toml"

[tasks.mise-doctor]
description = "Run mise doctor checks"
alias = ["md"]
run = "mise doctor"
